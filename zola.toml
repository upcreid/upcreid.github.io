base_url = "https://upcreid.github.io"
title = "/void !"
description = "Personal documentation - Guides, cheat sheets and technical resources"
default_language = "en"
author = "upcreid"

generate_feeds = true
feed_filenames = ["atom.xml"]
feed_limit = 20

build_search_index = true
generate_sitemap = true
generate_robots_txt = true
compile_sass = false
minify_html = false
hard_link_static = true
exclude_paginated_pages_in_sitemap = "all"
skip_content_templating = ["**"]

[markdown]
smart_punctuation = true
render_emoji = true
insert_anchor_links = "right"
bottom_footnotes = true
lazy_async_image = true
github_alerts = true
external_links_target_blank = true
external_links_no_referrer = true

[markdown.highlighting]
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-macchiato"
add_color_scheme = false

[search]
include_title = true
include_description = true
include_path = true
index_format = "elasticlunr_json"
truncate_content = true

[link_checker]
internal_level = "warn"
external_level = "warn"
skip_prefixes = ["http://www.teamliquid.net/"]

[extra]
repo_url = "https://github.com/upcreid/upcreid.github.io"
logo = "logo.png"
favicon = "logo.png"
edit_base = ""
search_sources = ["/search_index.en.json", "/search_index.fr.json"]

[[extra.langs]]
code = "en"
name = "English"
home = "/"

[[extra.langs]]
code = "fr"
name = "Français"
home = "/fr/"

[[extra.nav]]
key = "nav_overview"
path = "@/_index.md"
prefix = ""

[[extra.nav]]
key = "nav_blog"
path = "@/blog/_index.md"
prefix = "blog/"

[[extra.nav]]
key = "nav_cheatsheet"
path = "@/cheat-sheet/_index.md"
prefix = "cheat-sheet/"

[[extra.nav]]
key = "nav_games"
path = "@/games/_index.md"
prefix = "games/"

[[extra.nav]]
key = "nav_who"
path = "@/who/_index.md"
prefix = "who/"

[translations]
date_format = "MMMM d, y"
nav_overview = "Home"
nav_blog = "Blog"
nav_cheatsheet = "CheatSheet"
nav_games = "Games"
nav_who = "Who?"
menu = "Menu"
search = "Search"
search_placeholder = "Search…"
search_no_results = "No results"
search_results = "result(s)"
toc = "On this page"
edit = "Edit this page"
view_source = "View source"
prev = "Previous"
next = "Next"
back_to_blog = "Back to blog"
back_home = "Back to home"
read_more = "Read more"
reading_time = "min read"
